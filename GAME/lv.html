<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Level Game UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Trebuchet MS', sans-serif;
}

body{
    background:#1b1b1b;
    color:#fff;
    overflow:hidden;
}

/* ================= LOADING SCREEN ================= */

#loadingScreen{
    position:fixed;
    inset:0;
    background:#000000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

#loadingText{
    font-size:22px;
    margin-bottom:15px;
    letter-spacing:2px;
}

/* ONE LINE BAR */
#loadingBar{
    display:flex;
    gap:1px;
    border: 3px solid #ffffff;
}

.loadBox{
    width:24px;
    height:24px;
    background:#ffffff;
    border:1px solid #000;
    opacity:0.1;
    transition:0.3s;
}

.loadBox.active{
    background:#1eff00;
    opacity:1;
}

/* ================= MAIN GAME ================= */

#game{
    display:none;
    padding:20px;
}
.levelTitle{
    width: 700px;
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    padding: 18px 55px;
    font-family: 'Luckiest Guy', cursive;
    font-size: 50px;
    letter-spacing: 4px;
    color: #fff5dc;

    /* WOOD LOOK */
    background: linear-gradient(
        135deg,
        #8b5a2b,
        #6f3f1c
    );
    border: 4px solid #3e220e;
    border-radius: 20px;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,0.6),
        0 8px 15px rgba(0,0,0,0.7);

    z-index: 20;
}
.levelTitle::before,
.levelTitle::after{
    content:"";
    position:absolute;
    top:-35px;
    width:4px;
    height:35px;
    background:#c2b280;
}

.levelTitle::before{
    left:25px;
    transform:rotate(-10deg);
}

.levelTitle::after{
    right:25px;
    transform:rotate(10deg);
}

h1{
    text-align:center;
    margin-bottom:35px;
    letter-spacing:3px;
    background-color: #3e220e;
   font-family: 'Luckiest Guy','Orbitron', sans-serif;
   font-size: 55Px;
   
}

/* LEVEL GRID */
.levels{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(70px, 1fr));
    gap:18px;
    max-width:900px;
    margin:auto;
}

/* WOODEN DOOR LEVEL */
.level{
    height:120px;
    width: 70px;
    background:linear-gradient(135deg,#7a4a22,#5a3416);
    border:4px solid #3e220e;
    border-radius:8px;
    position:relative;
    cursor:pointer;
    box-shadow:inset 0 0 12px rgba(0,0,0,0.6),
               0 6px 12px rgba(0,0,0,0.6);
    transition:0.25s;
}

.level:hover{
    transform:translateY(-4px);
}

/* Door line */
.level::before{
    content:'';
    position:absolute;
    top:0;
 right: 26%;
    width:3px;
    height:100%;
    background:#2a1407;
    transform:translateX(-50%);
}

/* Door knob */
.level::after{
    content:'';
    position:absolute;
    top:50%;
    right:8px;
    width:8px;
    height:8px;
    background:#d6b46a;
    border-radius:50%;
}

.level span{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:16px;
    font-weight:bold;
    letter-spacing:1px;
}


/* LINK */
.level a{
    position:absolute;
    inset:0;
    text-decoration:none;
    color:white;
}
.level.locked{
    background:linear-gradient(135deg,#7a4a22,#5a3416);
    opacity:0.5;
    pointer-events:none;
}

.lockIcon{
    position:absolute;
    top:10px;
    right:10px;
    font-size:20px;
}
.backBtn{
    position:fixed;
    top:55px;
    left:20px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:linear-gradient(145deg,#7a4a22,#4a2a12);
    border:4px solid #3e220e;
    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.6),
        0 6px 12px rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.25s;
    text-decoration:none;
}

.backBtn:hover{
    transform:scale(1.08);
}

.backBtn:active{
    transform:scale(0.95);
}

/* ARROW */
.backArrow{
    width:0;
    height:0;
    border-top:10px solid transparent;
    border-bottom:10px solid transparent;
    border-right:16px solid #f5deb3;
    margin-right:3px;
}

/* ================= CLEAN WOOD PLANK ================= */

.plankBoard{
    position: relative;
    max-width: 1000px;
    margin: 90px auto;
    padding: 65px 55px;

    /* CONTRAST WOOD COLOR */
    background: linear-gradient(
        135deg,
        #c68642,
        #a05a2c,
        #7a3f1b
    );

    border: 10px solid #3b1f0e;
    border-radius: 28px;

    box-shadow:
        inset 0 0 18px rgba(0,0,0,0.5),
        0 18px 35px rgba(0,0,0,0.9);
}





/* ================= LEVEL GRID ================= */

.levels{
    position:relative;
    z-index:2;
}

</style>
<link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="home-wrapper">
<canvas id="particles"></canvas>
<!-- LOADING -->
<div id="loadingScreen">
    <div id="loadingText">LOADING...</div>
    <div id="loadingBar"></div>
</div>

<!-- GAME -->
<div id="game">


    <h1 class="levelTitle">LEVELS</h1>

    <a href="index.html" class="backBtn">
        <div class="backArrow"></div>
    </a>
    <br><br><br><br><br><br>
<div class="plankBoard">


    <div class="levels" id="levels"></div>
</div>

</div>
</div>
<script>
/* ================= LOADING ================= */

const loadingBar = document.getElementById("loadingBar");
const totalBoxes = Math.floor(Math.random() * 9) + 14;

for(let i=0;i<totalBoxes;i++){
    const box = document.createElement("div");
    box.className="loadBox";
    loadingBar.appendChild(box);
}

const boxes = document.querySelectorAll(".loadBox");
let index = 0;

function loadBoxes(){
    if(index < boxes.length){
        boxes[index].classList.add("active");
        index++;
        let speed = Math.random() * 900 + 100;
        setTimeout(loadBoxes, speed);
    }
}
loadBoxes();

setTimeout(()=>{
    document.getElementById("loadingScreen").style.display="none";
    document.getElementById("game").style.display="block";
},5000);


/* ================= LEVEL LOCK SYSTEM ================= */

const levelsContainer = document.getElementById("levels");

// new user check
let unlockedLevel = localStorage.getItem("unlockedLevel");

if(!unlockedLevel){
    unlockedLevel = 1; 
    localStorage.setItem("unlockedLevel", 1);
}else{
    unlockedLevel = parseInt(unlockedLevel);
}

// create levels
for(let i=1;i<=30;i++){
    const level = document.createElement("div");
    level.className = "level";

    if(i > unlockedLevel){
        // 🔒 LOCKED
        level.classList.add("locked");
        level.innerHTML = `
            <span> ${i}</span>
            <div class="lockIcon">🔒</div>
        `;
    }else{
        // 🔓 UNLOCKED
        level.innerHTML = `
            <a href="level${i}.html">
                <span>${i}</span>
            </a>
        `;
    }

    levelsContainer.appendChild(level);
}
</script>
<SCRipt src="js/script.js"></SCRipt>
</body>
</html>
