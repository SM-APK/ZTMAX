document.getElementById("nextBtn").addEventListener("click", function(){

    let unlockedLevel = parseInt(localStorage.getItem("unlockedLevel"));
    let currentLevel = 13; //change level

    if(unlockedLevel <= currentLevel){
        localStorage.setItem("unlockedLevel", currentLevel + 1);
    }

    window.location.href = "lv.html";
});

<script>
let unlockedLevel = localStorage.getItem("unlockedLevel");

if(!unlockedLevel){
    localStorage.setItem("unlockedLevel",1);
    unlockedLevel = 1;
}

unlockedLevel = parseInt(unlockedLevel);

let currentLevel = 13; //change level

if(currentLevel > unlockedLevel){
    alert("❌ Level Not Unlocked!");
    window.location.href = "lv.html";
}
</script>
