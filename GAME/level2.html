<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Level </title>
    <link rel="stylesheet" href="css/all-level-format.css">
    <style>
        .game-area{
  position:relative;
  width:20000px;  
  height:1100px;
  overflow:hidden;
  will-change: transform;
}
.platform{
  position:absolute;
  height:40px;
  background:orange;
  border-top:5px solid orange;
}

.ground{
  width:200px;
  bottom:400px;
  left:0;
}

.void{
  background-color: black;
  width: 100%;
  height: 360px;
}
    </style>
</head>
<body>
  
    <div class="game-wrapper">
<header class="heading">
    <h1 class="title">LEVEL 2</h1><!--change level -->
    <div id="menuToggle" class="menuBtn">
        <div class="menuLines"></div>
    </div>
</header>


<div class="menu-overlay" id="menuOverlay">
    <div class="menu-box">
        <h2 class="menu-heading">Game Menu</h2>
        <button class="menu-item" id="back">Back Level List</button>
        <button class="menu-item" id="restart">Restart</button>
        <button class="menu-item" id="pause">Pause</button>
    </div>
</div>
<!-- GAME OVER POPUP -->
<div class="gameover-overlay" id="gameOverPopup">
  <div class="gameover-box">
    <h2>💀 GAME OVER</h2>
    <button id="retryBtn">RETRY</button>
  </div>
</div>

<!-- LEVEL COMPLETE POPUP -->
<div class="levelCompletePopup" id="levelCompletePopup">
    <div class="completeBox">
        <h2> LEVEL COMPLETE</h2>
        <button id="nextBtn">Next Level ➜</button>
    </div>
</div>
       <div class="control-101">
<!-- 🔥 CONTROLS OUTSIDE GAME AREA -->
<button class="control-bnt" id="jump">JUMP</button>
<button class="control-bnt" id="down">DOWN</button>       
<button class="control-bnt" id="right">RIGHT</button>
<button class="control-bnt" id="left">LEFT</button>

</div>
    <div class="game-area">
        <div class="sky"></div>
<div class="player" id="player">
  <div class="head"></div>

  <div class="body">
    <div class="arm left">
      <div class="forearm"></div>
    </div>

    <div class="arm right">
      <div class="forearm"></div>
    </div>
  </div>

  <div class="leg left">
    <div class="lower-leg"></div>
  </div>

  <div class="leg right">
    <div class="lower-leg"></div>
  </div>
</div>
        <div class="platform ground"></div>

        <div class="platform" style="left:290px; bottom:400px; width:900px;"></div>
        <div class="platform" style="left:350px; bottom:530px; width:500px;"></div>
        <div class="platform" style="left:1290px; bottom:500px; width:900px;"></div>
        <div class="platform" style="left:2280px; bottom:500px; width:90px;"></div>
        <div class="platform" style="left:2280px; bottom:400px; width:90px;"></div>
        <div class="platform" style="left:2280px; bottom:450px; width:90px;"></div>
        <div class="platform" style="left:2460px; bottom:400px; width:6000px;"></div>
       
       






        <div class="door" style="left:3300px; bottom:450px;" id="door"></div>
    </div>
</div>
</body>
<SCRIpt>
document.getElementById("nextBtn").addEventListener("click", function(){

    let unlockedLevel = parseInt(localStorage.getItem("unlockedLevel"));
    let currentLevel = 2; //change level

    if(unlockedLevel <= currentLevel){
        localStorage.setItem("unlockedLevel", currentLevel + 1);
    }

    window.location.href = "lv.html";
});


</SCRIpt>
<script>
let unlockedLevel = localStorage.getItem("unlockedLevel");

if(!unlockedLevel){
    localStorage.setItem("unlockedLevel",1);
    unlockedLevel = 1;
}

unlockedLevel = parseInt(unlockedLevel);

let currentLevel = 1; //change level

if(currentLevel > unlockedLevel){
    alert("❌ Level Not Unlocked!");
    window.location.href = "lv.html";
}
</script>


<script src="js/all-level.js"></script>
</html>
